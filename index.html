<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battaglie Gnomiche</title>
    <!-- Favicon del gioco -->
    <link rel="icon" type="image/png" href="logobattagliegnomiche.png">
    
    <!-- Google Fonts per un look fantasy/moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07160d;
            --container-bg: rgba(11, 38, 22, 0.85);
            --border-green: #1e5631;
            --accent-green: #4c9a2a;
            --accent-hover: #5ab834;
            --text-light: #e8f5e9;
            --text-muted: #a5d6a7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            /* Sfumatura e atmosfera da foresta scura/aerea */
            background-image: radial-gradient(circle at center, #113820 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            background-color: var(--container-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border-green);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(76, 154, 42, 0.15);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--text-light);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 35px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #285e38 0%, #1b3d24 100%);
            border: 1px solid var(--accent-green);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
            cursor: pointer;
            text-align: center;
        }

        /* Pulsante principale "Gioca" in evidenza */
        .btn.primary {
            background: linear-gradient(135deg, #4c9a2a 0%, #2e6914 100%);
            border-color: #62c436;
            font-size: 1.25rem;
            box-shadow: 0 6px 15px rgba(76, 154, 42, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            filter: brightness(1.15);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Footer discreto */
        .footer-text {
            margin-top: 30px;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* Adattamento per schermi molto piccoli */
        @media (max-width: 480px) {
            .main-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Logo e Titolo -->
        <div class="logo-container">
            <img src="logobattagliegnomiche.png" alt="Logo Battaglie Gnomiche" class="logo">
        </div>
        
        <h1>Battaglie Gnomiche</h1>
        <p class="subtitle">Combatti, scambia e conquista il regno</p>

        <!-- Menu con i tasti richiesti -->
        <div class="menu-buttons">
            <a href="gioca.html" class="btn primary">Gioca</a>
            <a href="account.html" class="btn">Account / Avatar</a>
            <a href="impostazioni.html" class="btn">Impostazioni</a>
        </div>

        <div class="footer-text">
            &copy; Battaglie Gnomiche - GitHub Edition
        </div>
    </div>

</body>
</html>
